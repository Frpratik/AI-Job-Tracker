components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job:
          $ref: '#/components/schemas/Job'
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        status_label:
          type: string
          readOnly: true
        applied_date:
          type: string
          format: date
          nullable: true
        source:
          type: string
          maxLength: 80
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        priority_label:
          type: string
          readOnly: true
        is_archived:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
          readOnly: true
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistory'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - job
      - notes
      - priority_label
      - status_history
      - status_label
      - tags
      - updated_at
    ApplicationStatusEnum:
      enum:
      - wishlist
      - applied
      - viewed
      - recruiter_contacted
      - screening
      - assessment
      - technical_interview
      - hr_interview
      - final_interview
      - offer
      - accepted
      - rejected
      - withdrawn
      - on_hold
      type: string
      description: |-
        * `wishlist` - Wishlist
        * `applied` - Applied
        * `viewed` - Application viewed
        * `recruiter_contacted` - Recruiter contacted
        * `screening` - Screening
        * `assessment` - Assessment
        * `technical_interview` - Technical interview
        * `hr_interview` - HR interview
        * `final_interview` - Final interview
        * `offer` - Offer
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
        * `on_hold` - On hold
    BlankEnum:
      enum:
      - ''
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        logo_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - id
      - name
    Dashboard:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        interviews:
          type: integer
        offers:
          type: integer
        rejected:
          type: integer
        funnel:
          type: object
          additionalProperties:
            type: integer
        recent:
          type: array
          items:
            $ref: '#/components/schemas/Application'
      required:
      - active
      - funnel
      - interviews
      - offers
      - recent
      - rejected
      - total
    EmailToken:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    EmploymentTypeEnum:
      enum:
      - full_time
      - part_time
      - contract
      - internship
      - other
      type: string
      description: |-
        * `full_time` - Full-time
        * `part_time` - Part-time
        * `contract` - Contract
        * `internship` - Internship
        * `other` - Other
    ExperienceLevelEnum:
      enum:
      - entry
      - mid
      - senior
      - lead
      type: string
      description: |-
        * `entry` - Entry level
        * `mid` - Mid level
        * `senior` - Senior
        * `lead` - Lead / Manager
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          $ref: '#/components/schemas/Company'
        title:
          type: string
          maxLength: 180
        external_id:
          type: string
          maxLength: 120
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        location:
          type: string
          maxLength: 160
        work_mode:
          $ref: '#/components/schemas/WorkModeEnum'
        employment_type:
          $ref: '#/components/schemas/EmploymentTypeEnum'
        experience_level:
          type: string
          maxLength: 80
        salary_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        salary_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        salary_currency:
          type: string
          maxLength: 3
      required:
      - company
      - id
      - title
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        body:
          type: string
          maxLength: 10000
        is_important:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - updated_at
    PaginatedApplicationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Application'
    PaginatedNoteList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Note'
    PaginatedTagList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - password
      - token
      - uid
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PatchedApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job:
          $ref: '#/components/schemas/Job'
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        status_label:
          type: string
          readOnly: true
        applied_date:
          type: string
          format: date
          nullable: true
        source:
          type: string
          maxLength: 80
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        priority_label:
          type: string
          readOnly: true
        is_archived:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
          readOnly: true
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistory'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        body:
          type: string
          maxLength: 10000
        is_important:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 40
        color:
          type: string
          maxLength: 7
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 120
        is_email_verified:
          type: boolean
          readOnly: true
        profile:
          $ref: '#/components/schemas/Profile'
        created_at:
          type: string
          format: date-time
          readOnly: true
    PriorityEnum:
      enum:
      - low
      - medium
      - high
      type: string
      description: |-
        * `low` - Low
        * `medium` - Medium
        * `high` - High
    Profile:
      type: object
      properties:
        target_role:
          type: string
          maxLength: 120
        preferred_locations: {}
        experience_level:
          oneOf:
          - $ref: '#/components/schemas/ExperienceLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        work_preference:
          oneOf:
          - $ref: '#/components/schemas/WorkPreferenceEnum'
          - $ref: '#/components/schemas/BlankEnum'
        onboarding_completed:
          type: boolean
    Register:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - email
      - full_name
      - password
    StatusHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        from_status:
          oneOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
        from_status_label:
          type: string
          readOnly: true
        to_status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        to_status_label:
          type: string
          readOnly: true
        changed_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - changed_at
      - from_status_label
      - id
      - to_status
      - to_status_label
    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 40
        color:
          type: string
          maxLength: 7
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 120
        is_email_verified:
          type: boolean
          readOnly: true
        profile:
          $ref: '#/components/schemas/Profile'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - is_email_verified
      - profile
    WorkModeEnum:
      enum:
      - remote
      - hybrid
      - onsite
      - unspecified
      type: string
      description: |-
        * `remote` - Remote
        * `hybrid` - Hybrid
        * `onsite` - On-site
        * `unspecified` - Not specified
    WorkPreferenceEnum:
      enum:
      - remote
      - hybrid
      - onsite
      - any
      type: string
      description: |-
        * `remote` - Remote
        * `hybrid` - Hybrid
        * `onsite` - On-site
        * `any` - Any
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
