name: CI Pipeline (Backend & Frontend)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & Migrations Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobtracker_test
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Missing Migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: test-secret-key-ci
          DB_ENGINE: sqlite

      - name: Run Backend Test Suite
        run: |
          cd backend
          python manage.py test
        env:
          SECRET_KEY: test-secret-key-ci
          DB_ENGINE: postgres
          DATABASE_URL: postgres://jobtracker:test_password_123@localhost:5432/jobtracker_test

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NODE_ENV: production
